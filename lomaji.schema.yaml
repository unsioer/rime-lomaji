# Rime Schema
# vim: set sw=2 sts=2 et:
# encoding: utf-8


schema:
  schema_id: lomaji
  name: Lô-má-jī
  version: "2026.11.16"
  author: "Enatsu"
  description: |
    Rime Bân-lâm-gú Lô-má-jī su-ji̍p hong-àn.
    Iōng q, w, z, x, d kah f suán jī.
  
switches:
  - name: ascii_mode
    reset: 0
    states: [ LMJ, English ]
  - name: poj
    states: [ TL, POJ ]
  - name: defer_space
    reset: 1
    states: [ 毋補閬空, 自動閬空 ]
  - name: capital
    states: [ Suè, TUĀ ]
  
engine:
  processors:
    - lua_processor@*lomaji_spacing
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - r10n_translator
  filters:
    - lua_filter@*lomaji_filter
    - simplifier@poj
    - simplifier@capital
    - lua_filter@*lomaji_spacing*filter

menu:
  alternative_select_keys: "qwzxdf"
  alternative_select_labels: [ q, w, z, x, d, f ]
  page_size: 6

speller:
  alphabet: 'QWERTYUIOPASDFGHJKLZXCVBNMyvutsrponmlkjihgecba-123456789'
  initials: QWERTYUIOPASDFGHJKLZXCVBNMyvutsrponmlkjihgecba-
  algebra:
    - erase/\s/
    - derive/(\-)*//
    - derive/([1-9])//
    - derive/\-/y/
    - derive/ua/oa/
    - derive/ue/oe/
    - derive/ts/ch/
    - derive/Ua/Oa/
    - derive/Ue/Oe/
    - derive/Ts/Ch/
    

translator:
  dictionary: lomaji
  prism: lomaji_nature

poj:
  opencc_config: tl2poj.json
  option_name: poj
  tips: all

capital:
  opencc_config: l2u.json
  option_name: capital
  tips: all
