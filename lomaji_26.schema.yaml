# Rime Schema
# vim: set sw=2 sts=2 et:
# encoding: utf-8


schema:
  schema_id: lomaji_26
  name: Lô-má-jī (26 Kiān)
  version: "2026.11.16"
  author: "Enatsu"
  description: |
    Rime Bân-lâm-gú Lô-má-jī su-ji̍p hong-àn.
    q=2 w=3 z=5 x=6 d=7/8 f=1/4 v=9
    Sòo-jī suán jī.
  
switches:
  - name: ascii_mode
    reset: 0
    states: [ LMJ, English ]
  - name: poj
    states: [ TL, POJ ]
  - name: defer_space
    reset: 1
    states: [ 毋補閬空, 自動閬空 ]
  - name: capital
    states: [ Suè, TUĀ ]
  
engine:
  processors:
    - lua_processor@*lomaji_spacing
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - r10n_translator
  filters:
    - lua_filter@*lomaji_filter
    - simplifier@poj
    - simplifier@capital
    - lua_filter@*lomaji_spacing*filter

menu:
  page_size: 8

speller:
  alphabet: 'QWERTYUIOPASDFGHJKLZXCVBNMzyxwvutsrqponmlkjihgfedcba-'
  initials: QWERTYUIOPASDFGHJKLZXCVBNMzyxwvutsrqponmlkjihgfedcba-
  algebra:
    - erase/\s/
    - derive/(\-)*//
    - derive/([1-9])//
    - xform/2/q/
    - xform/3/w/
    - xform/5/z/
    - xform/6/x/
    - xform/7/d/
    - xform/8/d/
    - xform/1/f/
    - xform/4/f/
    - xform/9/v/
    - derive/\-/y/
    - derive/ua/oa/
    - derive/ue/oe/
    - derive/ts/ch/
    - derive/Ua/Oa/
    - derive/Ue/Oe/
    - derive/Ts/Ch/
    

translator:
  dictionary: lomaji
  prism: lomaji_26

poj:
  opencc_config: tl2poj.json
  option_name: poj
  tips: all

capital:
  opencc_config: l2u.json
  option_name: capital
  tips: all
